name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PROJECT_NAME: LenovoOnlineClassTrainer

jobs:
  build-cli:
    name: Build CLI (main.cpp)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile CLI
      run: |
        cl /EHsc /std:c++11 main.cpp /Fe:trainer.exe
        if exist trainer.exe (echo CLI build success) else (exit 1)

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: trainer-cli
        path: trainer.exe

  build-gui:
    name: Build GUI (main_gui.cpp)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat'
        cache: true

    - name: Build GUI with qmake
      run: |
        qmake -project "QT+=widgets" "CONFIG+=c++11" -o trainer_gui.pro
        echo "SOURCES += main_gui.cpp" >> trainer_gui.pro
        echo "HEADERS += core.hpp" >> trainer_gui.pro
        qmake trainer_gui.pro
        nmake release

    - name: Deploy Qt dependencies
      run: |
        windeployqt release\trainer_gui.exe --no-translations --no-opengl-sw
        if exist release\trainer_gui.exe (echo GUI build success) else (exit 1)

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v4
      with:
        name: trainer-gui
        path: release/

  release:
    name: Create Release Package
    needs: [build-cli, build-gui]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download CLI artifact
      uses: actions/download-artifact@v4
      with:
        name: trainer-cli
        path: ./package/

    - name: Download GUI artifact
      uses: actions/download-artifact@v4
      with:
        name: trainer-gui
        path: ./package/gui/

    - name: Copy additional files
      run: |
        copy LICENSE package\
        echo "README.md copied to package" > package\README.txt
        
    - name: Create ZIP package
      run: |
        cd package
        7z a ../${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows.zip *
        
    - name: Upload package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Build
    needs: [build-cli, build-gui]
    runs-on: windows-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Download CLI artifact
      uses: actions/download-artifact@v4
      with:
        name: trainer-cli
        path: ./test/

    - name: Download GUI artifact
      uses: actions/download-artifact@v4
      with:
        name: trainer-gui
        path: ./test/gui/

    - name: Verify executables
      run: |
        if exist test\trainer.exe (echo CLI executable found)
        if exist test\gui\trainer_gui.exe (echo GUI executable found)
        echo "Test completed successfully"
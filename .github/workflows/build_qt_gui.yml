name: Build Qt GUI Version

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.3'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 使用正确的 qmake 方式构建
    - name: Build GUI
      run: |
        # 创建构建目录
        mkdir build-gui
        cd build-gui
        
        # 方法1: 使用 qmake -project 生成项目文件
        qmake -project "QT+=widgets" "CONFIG+=c++17" -o trainer_gui.pro ..
        
        # 修改生成的 .pro 文件，明确指定源文件和目标
        echo "SOURCES = ../main_gui.cpp" > temp.pro
        echo "HEADERS = ../core.hpp" >> temp.pro
        echo "TARGET = trainer_gui" >> temp.pro
        echo "TEMPLATE = app" >> temp.pro
        echo "QT += widgets core gui" >> temp.pro
        echo "CONFIG += c++17" >> temp.pro
        echo "INCLUDEPATH += .." >> temp.pro
        # 合并到原有的 .pro 文件（或者直接覆盖）
        type temp.pro > trainer_gui.pro
        
        # 生成 Makefile
        qmake trainer_gui.pro
        # 编译
        nmake release
        
        # 创建输出目录并复制文件
        mkdir ..\..\output
        copy release\trainer_gui.exe ..\..\output\

    - name: Deploy Qt Dependencies
      run: |
        cd output
        windeployqt trainer_gui.exe --release --no-translations

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LenovoTrainer-GUI-Windows
        path: output/
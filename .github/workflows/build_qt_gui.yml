name: Build Qt GUI Version

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.3'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build GUI with MSVC
      run: |
        # 显示 Qt 路径信息
        Write-Host "QT_ROOT_DIR: $env:QT_ROOT_DIR"
        
        # 设置路径
        $QT_INCLUDE = "$env:QT_ROOT_DIR\include"
        $QT_LIB = "$env:QT_ROOT_DIR\lib"
        
        # 创建输出目录
        mkdir output -Force
        
        # 编译（添加 /Zc:__cplusplus 选项）
        cl /nologo /EHsc /std:c++17 /Zc:__cplusplus /MD /O2 `
           /DUNICODE /D_UNICODE /DWIN32 /DWIN64 /DNDEBUG `
           /I"$QT_INCLUDE" `
           /I"$QT_INCLUDE\QtCore" `
           /I"$QT_INCLUDE\QtGui" `
           /I"$QT_INCLUDE\QtWidgets" `
           /I"." `
           main_gui.cpp `
           /link /NOLOGO /LIBPATH:"$QT_LIB" `
           Qt6Core.lib Qt6Gui.lib Qt6Widgets.lib `
           advapi32.lib user32.lib shell32.lib `
           /OUT:output\trainer_gui.exe
        
        # 检查结果
        if (Test-Path "output\trainer_gui.exe") {
            Write-Host "Build successful!" -ForegroundColor Green
            Write-Host "File size: $((Get-Item output\trainer_gui.exe).Length / 1KB) KB"
        } else {
            Write-Host "Build failed!" -ForegroundColor Red
            exit 1
        }

    - name: Deploy Qt Dependencies
      run: |
        cd output
        windeployqt trainer_gui.exe --release --no-translations

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LenovoTrainer-GUI-Windows
        path: output/